name: Build Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "both"
        type: choice
        options:
          - apk
          - aab
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Find generated files
        run: |
          echo "Generated APK/AAB files:"
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Verify APK/AAB
        run: |
          if [[ "${{ inputs.build_type }}" == "apk" || "${{ inputs.build_type }}" == "both" ]]; then
            test -n "$(find app/build/outputs -name '*.apk' -type f -size +0c)"
          fi

          if [[ "${{ inputs.build_type }}" == "aab" || "${{ inputs.build_type }}" == "both" ]]; then
            test -n "$(find app/build/outputs -name '*.aab' -type f -size +0c)"
          fi

      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Web2App-AAB
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
